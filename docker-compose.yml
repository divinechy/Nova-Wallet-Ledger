services:
  db:
    image: postgres:16-alpine
    container_name: novawallet-db
    environment:
      POSTGRES_DB: novawallet
      POSTGRES_USER: novawallet
      POSTGRES_PASSWORD: novawallet_dev_pw
    ports:
      - "5433:5432"
    volumes:
      - novawallet_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novawallet -d novawallet"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novawallet-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=novawallet;Username=novawallet;Password=novawallet_dev_pw"
      Jwt__Issuer: "novawallet-dev-issuer"
      Jwt__Audience: "novawallet-api"
      Jwt__SigningKey: "dev-only-signing-key-change-me-please-32bytes-min!"
      DailyOutboundLimitKobo: "50000000"
    ports:
      - "8080:8080"

volumes:
  novawallet_pgdata:
